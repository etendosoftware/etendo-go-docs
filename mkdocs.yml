site_name: Etendo Go
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/home.js

plugins:
  - search:
      lang: es
  - glightbox
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Primeros pasos:
      - primeros-pasos/index.md
      - ¿Qué es Etendo Go?: primeros-pasos/que-es-etendo-go.md
      - Cómo acceder: primeros-pasos/como-acceder.md
      - Configuración inicial: primeros-pasos/configuracion-inicial.md
  - Dashboard: dashboard/index.md
  - Contactos:
      - contactos/index.md
      - Clientes: contactos/clientes.md
      - Proveedores: contactos/proveedores.md
  - Ventas:
      - ventas/index.md
      - Pedidos de venta: ventas/pedidos-de-venta.md
      - Facturas de venta: ventas/facturas-de-venta.md
  - Compras:
      - compras/index.md
      - Pedidos de compra: compras/pedidos-de-compra.md
      - Facturas de compra: compras/facturas-de-compra.md
  - Finanzas:
      - finanzas/index.md
      - Tesorería: finanzas/tesoreria.md
      - Conciliación bancaria: finanzas/conciliacion-bancaria.md
  - Inventario:
      - inventario/index.md
      - Productos: inventario/productos.md
      - Almacenes: inventario/almacenes.md
  - Configuración:
      - configuracion/index.md
      - Datos de empresa: configuracion/datos-de-empresa.md
      - Usuarios y permisos: configuracion/usuarios-y-permisos.md
