site_name: Etendo Go Academy
docs_dir: docs
site_url: https://etendosoftware.github.io/etendo-go-docs/
repo_url: https://github.com/etendosoftware/etendo-go-docs
repo_name: etendosoftware/etendo-go-docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/home.js

plugins:
  - search:
      lang: es
  - i18n:
      docs_structure: folder
      languages:
        - locale: es
          default: true
          name: Español
          build: true
          nav:
            - Inicio: index.md
            - Primeros pasos:
                - primeros-pasos/index.md
                - ¿Qué es Etendo Go?: primeros-pasos/que-es-etendo-go/que-es-etendo-go.md
                - Cómo crear tu cuenta: primeros-pasos/como-crear-tu-cuenta/como-crear-tu-cuenta.md
                - Navegar en Etendo Go: primeros-pasos/navegar-en-etendo-go/navegar-en-etendo-go.md
            - Comercial:
                - comercial/index.md
                - Contactos:
                    - ¿Qué es la sección Contactos?: comercial/contactos/que-es-la-seccion-contactos/que-es-la-seccion-contactos.md
                    - Cómo crear un contacto: comercial/contactos/como-crear-un-contacto/como-crear-un-contacto.md
                    - Gestionar tus contactos: comercial/contactos/gestionar-tus-contactos/gestionar-tus-contactos.md
                - Ventas:
                    - comercial/ventas/index.md
                    - Presupuesto de venta: comercial/ventas/presupuesto-de-venta/presupuesto-de-venta.md
                    - Pedido de venta: comercial/ventas/pedido-de-venta/pedido-de-venta.md
                    - Factura de venta: comercial/ventas/factura-de-venta/factura-de-venta.md
            - Operaciones:
                - Compras:
                    - operaciones/compras/index.md
                    - Pedido de compra: operaciones/compras/pedido-de-compra/pedido-de-compra.md
                    - Factura de compra: operaciones/compras/factura-de-compra/factura-de-compra.md
                - Inventario:
                    - operaciones/inventario/index.md
                    - ¿Qué es la sección Inventario?: operaciones/inventario/que-es-inventario/que-es-inventario.md
                    - Productos:
                        - operaciones/inventario/productos/index.md
                        - Cómo crear un producto: operaciones/inventario/productos/como-crear-un-producto/como-crear-un-producto.md
                        - Cómo crear y configurar una categoría de producto: operaciones/inventario/productos/como-crear-una-categoria-de-producto/como-crear-una-categoria-de-producto.md
                        - Cómo editar o eliminar un producto: operaciones/inventario/productos/como-editar-o-eliminar-un-producto/como-editar-o-eliminar-un-producto.md
                        - Cómo gestionar tarifas de producto: operaciones/inventario/productos/como-gestionar-tarifas-de-producto/como-gestionar-tarifas-de-producto.md
                    - Almacén:
                        - operaciones/inventario/almacenes/index.md
                        - Cómo crear un almacén: operaciones/inventario/almacenes/como-crear-un-almacen/como-crear-un-almacen.md
            - Finanzas:
                - Activos: finanzas/activos/activos.md
                - Apuntar un Activo: finanzas/activos/apuntar-un-activo.md
                - Amortización: finanzas/amortizacion/amortizacion.md
            - Configuración:
                - configuracion/index.md
        
  - glightbox
  - tags
  - git-committers:
      repository: etendosoftware/etendo-go-docs
      branch: main
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: date
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/etendosoftware
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/etendo-software/
      name: LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/etendo.software/
      name: Instagram
  consent:
    title: Valoramos tu privacidad
    description: >-
      Utilizamos cookies y otras tecnologías de seguimiento para mejorar tu experiencia de navegación,
      mostrarte contenido personalizado, analizar el tráfico del sitio y entender de dónde provienen
      nuestros visitantes. Al hacer clic en "Aceptar", aceptás el uso de cookies.
      <a href="https://etendo.software/en/cookie-policy-2/" target="_blank">Política de cookies</a>
    actions:
      - accept
      - manage

copyright: Copyright &copy; 2021 - 2026 Futit Services S.L.

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

